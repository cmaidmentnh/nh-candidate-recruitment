{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='whip.css') }}?v=5">{% endblock %}
{% block content %}
<div class="wk {% block wide %}{% endblock %}">
  <nav class="wknav">
    <a href="{{ url_for('whip.my_list') }}" class="{{ 'on' if request.endpoint in ['whip.my_list','whip.candidate'] }}">My List</a>
    {% if can_admin_whip %}
    <a href="{{ url_for('whip.results') }}" class="{{ 'on' if request.endpoint=='whip.results' }}">Results</a>
    <a href="{{ url_for('whip.assign') }}" class="{{ 'on' if request.endpoint=='whip.assign' }}">Assign</a>
    <a href="{{ url_for('whip.roster') }}" class="{{ 'on' if request.endpoint=='whip.roster' }}">Whips</a>
    <a href="{{ url_for('whip.rounds') }}" class="{{ 'on' if request.endpoint=='whip.rounds' }}">Rounds</a>
    <a href="{{ url_for('whip.export') }}">Export</a>
    {% endif %}
  </nav>
  {% block whip %}{% endblock %}
</div>
{% endblock %}
