{% extends "base.html" %}

{% block head %}
<style>
/* ------------------------------------------------------------------ shell */
:root { --navy:#183e91; --red:#b52b18; --ink:#141821; --muted:#6c757d;
        --line:#e3e5e8; --paper:#f7f7f9; }
.wk { max-width: 1080px; margin: 0 auto; padding: 0 12px 90px; }

.wk-nav { display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch;
          border-bottom:2px solid var(--line); margin:6px 0 18px; padding-bottom:0; }
.wk-nav a { flex:0 0 auto; padding:11px 14px; font-size:14px; font-weight:600;
            color:var(--muted); text-decoration:none; border-bottom:3px solid transparent;
            margin-bottom:-2px; white-space:nowrap; }
.wk-nav a.on { color:var(--navy); border-bottom-color:var(--navy); }

.wk-h1 { font-size:22px; font-weight:800; margin:0 0 2px; }
.wk-sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
.sec-h { font-size:12px; text-transform:uppercase; letter-spacing:.5px;
         color:var(--muted); font-weight:700; margin:22px 0 8px; }

.card { border:1px solid var(--line); border-radius:10px; background:#fff; padding:14px; }
.grid { display:grid; gap:10px; }
.g2 { grid-template-columns:repeat(2,1fr); }
.g4 { grid-template-columns:repeat(2,1fr); }
@media (min-width:700px){ .g4 { grid-template-columns:repeat(4,1fr); }
                          .split { display:grid; grid-template-columns:1fr 2fr; gap:14px; align-items:start; } }

.stat { text-align:center; }
.stat .n { font-size:26px; font-weight:800; line-height:1.1; }
.stat .l { font-size:11.5px; color:var(--muted); margin-top:2px; }
.stat.warn .n { color:var(--red); }

.bar { height:22px; border-radius:5px; background:#eceef1; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--navy); }
.mini { height:6px; border-radius:3px; background:#eceef1; overflow:hidden; min-width:56px; }
.mini i { display:block; height:100%; background:var(--navy); }

/* ------------------------------------------------------------------ chips */
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { position:relative; }
.chip input { position:absolute; opacity:0; pointer-events:none; }
.chip span { display:inline-block; padding:9px 13px; border:1px solid #d5d7db;
             border-radius:999px; font-size:14.5px; background:#fff; cursor:pointer; }
.chip input:checked + span { background:var(--red); border-color:var(--red);
                             color:#fff; font-weight:600; }

.tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
       font-weight:700; background:#eef0f3; color:#43484f; }
.tag.ok   { background:#e7f2e8; color:#256a2c; }
.tag.warn { background:#fdf0e3; color:#8a4b12; }
.tag.bad  { background:#fbe9e7; color:#98261a; }

/* ---------------------------------------------------------------- listing */
.rowcard { display:block; border:1px solid var(--line); border-left-width:5px;
           border-radius:10px; padding:12px 14px; margin-bottom:9px; background:#fff;
           text-decoration:none; color:inherit; }
.rowcard:active { background:#f6f7f9; }
.rowcard.never { border-left-color:var(--red); }
.rowcard.gaps  { border-left-color:#d9a441; }
.rowcard.ok    { border-left-color:#2e7d32; }
.rc-1 { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.rc-n { font-weight:700; font-size:16px; }
.rc-d { color:var(--muted); font-size:12.5px; white-space:nowrap; }
.rc-2 { margin-top:3px; color:#5a6068; font-size:13px; }
.rc-g { margin-top:5px; font-size:12.5px; color:#8a4b12; }
.rc-m { margin-top:5px; font-size:11.5px; color:#8a8f97; }

table.t { width:100%; border-collapse:collapse; font-size:14px; }
table.t th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
             color:var(--muted); padding:7px 8px; border-bottom:1px solid var(--line); }
table.t td { padding:8px; border-bottom:1px solid #f0f1f3; }
table.t td.r, table.t th.r { text-align:right; }

.btn { display:inline-block; padding:12px 16px; border-radius:9px; border:0;
       font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; }
.btn-red  { background:var(--red); color:#fff; }
.btn-navy { background:var(--navy); color:#fff; }
.btn-out  { background:#fff; color:var(--navy); border:1px solid var(--navy); }
.btn:disabled { background:#9aa0a6; }
.btn-wide { width:100%; text-align:center; }

.fld { margin-bottom:12px; }
.fld label { display:block; font-size:14px; font-weight:600; margin-bottom:5px; }
.fld input[type=text], .fld input[type=date], .fld select, .fld textarea {
  width:100%; padding:10px; border:1px solid #d5d7db; border-radius:8px;
  font-size:16px; font-family:inherit; }
.fld textarea { min-height:78px; }
.empty { padding:26px 8px; text-align:center; color:var(--muted); }
.feed { font-size:13px; color:#5a6068; border-bottom:1px solid #f0f1f3; padding:7px 0; }
</style>
{% endblock %}

{% block content %}
<div class="wk">
  <nav class="wk-nav">
    <a href="{{ url_for('progress.whip_dashboard') }}"
       class="{{ 'on' if request.endpoint=='progress.whip_dashboard' }}">Dashboard</a>
    <a href="{{ url_for('progress.whip_mine') }}"
       class="{{ 'on' if request.endpoint=='progress.whip_mine' }}">My List</a>
    <a href="{{ url_for('progress.whip_list') }}"
       class="{{ 'on' if request.endpoint in ['progress.whip_list','progress.whip_candidate'] }}">Board</a>
    <a href="{{ url_for('progress.whip_tasks') }}"
       class="{{ 'on' if request.endpoint=='progress.whip_tasks' }}">Tasks</a>
    {% if can_access_progress %}
    <a href="{{ url_for('progress.progress') }}">Matrix</a>
    <a href="{{ url_for('progress.whip_export') }}">Export</a>
    {% endif %}
  </nav>

  {% block whip %}{% endblock %}
</div>
{% endblock %}
